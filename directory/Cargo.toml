[package]
name = "directory"
version = "0.1.0"
edition = "2021"
authors = ["Abako contributors"]
publish = false
license = "Apache-2.0"

[dependencies]
ink = { version = "=5.1.1", default-features = false }
scale = { package = "parity-scale-codec", version = "=3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "=2.11.6", default-features = false, features = ["derive"], optional = true }
calendar = { git = "https://github.com/abako-dev/contracts.git", rev = "ce9ed40ffd48c6c25b0f0ca285ac5d4fc6251d64", default-features = false, features = ["ink-as-dependency"] }

rand = { version = "=0.10.2", default-features = false, features = ["std_rng"] }

chrono = { version = "=0.4.45", default-features = false }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = ["ink/std", "scale/std", "scale-info/std", "calendar/std", "chrono/std"]
ink-as-dependency = []
