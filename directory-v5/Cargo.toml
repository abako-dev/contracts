[package]
name = "directory-v5"
version = "0.1.0"
edition = "2021"
authors = ["Abako contributors"]
publish = false
license = "Apache-2.0 AND Unicode-3.0"

[dependencies]
storage-v5 = { git = "https://github.com/abako-dev/contracts.git", rev = "54643f552e96f08c8ea46b32c96e50c8a2cd16da", default-features = false }
ink = { version = "=5.1.1", default-features = false }
scale = { package = "parity-scale-codec", version = "=3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "=2.11.6", default-features = false, features = ["derive"], optional = true }
calendar-v5 = { git = "https://github.com/abako-dev/contracts.git", rev = "b21f84fd44ae657b653dcad0de980d2517723fa2", default-features = false, features = ["ink-as-dependency"] }

rand = { version = "=0.10.2", default-features = false, features = ["std_rng"] }

chrono = { version = "=0.4.45", default-features = false }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = ["storage-v5/std", "ink/std", "scale/std", "scale-info/std", "calendar-v5/std", "chrono/std"]
ink-as-dependency = []
