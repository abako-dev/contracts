[package]
name = "storage-v5"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
ink = { version = "=5.1.1", default-features = false }
scale = { package = "parity-scale-codec", version = "=3.7.5", default-features = false, features = ["derive"] }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = ["ink/std", "scale/std"]
