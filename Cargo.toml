[workspace]
resolver = "2"
members = ["dao", "project", "tests/fixtures/sandbox-probe"]
default-members = ["dao", "project"]

[workspace.dependencies]
ink = { version = "=5.1.1", default-features = false }
scale = { package = "parity-scale-codec", version = "=3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "=2.11.6", default-features = false, features = ["derive"] }
rand = { version = "=0.10.2", default-features = false, features = ["std_rng"] }
chrono = { version = "=0.4.45", default-features = false }
