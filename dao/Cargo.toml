[package]
name = "dao"
version = "0.1.0"
edition = "2021"
authors = ["Digesta contributors"]
publish = false
license = "Apache-2.0"

[dependencies]
ink.workspace = true
scale.workspace = true
scale-info = { workspace = true, optional = true }

rand.workspace = true

chrono.workspace = true

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = ["ink/std", "scale/std", "scale-info/std", "chrono/std"]
ink-as-dependency = []
