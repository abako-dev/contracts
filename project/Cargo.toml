[package]
name = "project"
version = "0.1.0"
edition = "2021"
authors = ["Digesta contributors"]
publish = false
license = "Apache-2.0 AND Unicode-3.0"

[dependencies]
ink.workspace = true
scale.workspace = true
scale-info = { workspace = true, optional = true }
dao = { git = "https://github.com/abako-dev/contracts.git", rev = "87ac5da186e20e95d02e80fd34a6c8178c00b7aa", default-features = false, features = ["ink-as-dependency"] }
rand.workspace = true
chrono.workspace = true

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = ["ink/std", "scale/std", "scale-info/std", "dao/std", "chrono/std"]
ink-as-dependency = []
