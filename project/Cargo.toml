[package]
name = "project"
version = "0.1.0"
edition = "2021"
authors = ["Digesta contributors"]
publish = false
license = "Apache-2.0 AND Unicode-3.0"

[dependencies]
ink = { version = "=5.1.1", default-features = false }
scale = { package = "parity-scale-codec", version = "=3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "=2.11.6", default-features = false, features = ["derive"], optional = true }
calendar = { git = "https://github.com/abako-dev/contracts.git", rev = "4cc83cd7bb12d32c6e3adca74d78d90e09476a83", default-features = false, features = ["ink-as-dependency"] }
directory = { git = "https://github.com/abako-dev/contracts.git", rev = "a98a5328613f877bd5faa7b9ea1bd2551d4b4a0c", default-features = false, features = ["ink-as-dependency"] }
rand = { version = "=0.10.2", default-features = false, features = ["std_rng"] }
chrono = { version = "=0.4.45", default-features = false }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = ["ink/std", "scale/std", "scale-info/std", "calendar/std", "directory/std", "chrono/std"]
ink-as-dependency = []
