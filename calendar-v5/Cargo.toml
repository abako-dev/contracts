[package]
name = "calendar-v5"
version = "0.1.0"
edition = "2021"
authors = ["Abako contributors"]
publish = false
license = "Apache-2.0"

[dependencies]
storage-v5 = { git = "https://github.com/abako-dev/contracts.git", rev = "f147e595be06cddd8a8346cb86fd000721f8df23", default-features = false }
ink = { version = "=5.1.1", default-features = false }
scale = { package = "parity-scale-codec", version = "=3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "=2.11.6", default-features = false, features = ["derive"], optional = true }
chrono = { version = "=0.4.45", default-features = false }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = ["storage-v5/std", "ink/std", "scale/std", "scale-info/std", "chrono/std"]
ink-as-dependency = []
